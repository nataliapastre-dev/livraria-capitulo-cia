{% extends "base.html" %}

{% block body %}

<div class="container">

    <h1>{{ livro.titulo }}</h1>

    <p><strong>Autor:</strong> {{ livro.autor.nome }}</p>
    <p><strong>Preço:</strong> R$ {{ livro.preco }}</p>

    {% if livro.imagem %}
        <img src="{{ livro.imagem.url }}" width="200">
    {% endif %}

    <br><br>
    <a href="/">⬅ Voltar</a>

</div>

{% endblock %}
